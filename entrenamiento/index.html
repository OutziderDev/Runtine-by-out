<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalles de Entrenamiento</title>
  <link rel="stylesheet" href="../css/index.css" />
  <script  type="module" src="../js/infodetail.js"></script>
</head>
<body>

  <hero-section></hero-section>

  <section class="info-detail">

    <header class="info-header">
      <div class="info-text">
        <span id="subtitulo" class="info-tipo"></span>
        <span id="fecha" class="info-fecha"></span>
      </div>
    </header>

    <div class="stats">
      <article class="stat-card">
        <span class="stat-label">Distancia</span>
        <span id="distancia" class="stat-value">4km</span>
      </article>
      <article class="stat-card" id="stat-ritmo">
        <span class="stat-label">Ritmo</span>
        <span id="ritmo-unico" class="stat-value"></span>
      </article>
    </div>

    <section class="panel" id="panel-ritmo-list">
      <h3>Desglose por km</h3>
      <ul id="ritmo-list">

      </ul>
    </section>

    <section class="panel" id="panel-objetivo">
      <h3>Objetivos</h3>
      <ul id="objetivo-list">

      </ul>
    </section>

    <section class="panel" id="panel-notas">
      <h3>Notas</h3>
      <p id="nota-desc">Este es un entrenamiento de recuperación.</p>
    </section>

  </section>

  <nav>
    <a href="../" class="back">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
        <path d="M5 12l14 0" />
        <path d="M5 12l6 6" />
        <path d="M5 12l6 -6" />
      </svg>
    </a>
  </nav>

</body>
</html>
